<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#04df6c" />
    <!-- Pick the colour theme before first paint: saved choice, else the OS setting. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("foxtheta-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (error) {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <title>Foxtheta — Strategic Intelligence. Real Impact.</title>
    <meta
      name="description"
      content="Foxtheta builds production-grade AI agents, RAG knowledge systems, workflow automation and custom AI applications that move real business metrics."
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foxtheta" />
    <meta
      property="og:title"
      content="Foxtheta — Strategic Intelligence. Real Impact."
    />
    <meta
      property="og:description"
      content="We design, build and ship AI systems that survive production — agents, RAG, automation and custom applications."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Chivo+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
